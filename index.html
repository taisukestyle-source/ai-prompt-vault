<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prompt Vault">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>AI Prompt Vault</title>
  <style>
    :root{color-scheme:dark;--bg:#09090d;--panel:#14141b;--panel2:#1c1c26;--line:#2a2a37;--text:#f4f2f8;--muted:#a09eae;--accent:#a78bfa;--accent2:#7c3aed;--danger:#fb7185}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#191426 0,#09090d 48%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;min-height:100vh}
    button,input,textarea,select{font:inherit}button{cursor:pointer}
    .app{max-width:900px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
    .brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#a78bfa,#5b21b6);display:grid;place-items:center;font-size:22px;box-shadow:0 8px 24px #7c3aed44}
    h1{font-size:20px;margin:0;letter-spacing:.2px}.sub{font-size:11px;color:var(--muted);letter-spacing:1.6px;margin-top:3px}
    .iconbtn,.secondary,.primary,.danger{border:1px solid var(--line);border-radius:12px;padding:10px 13px;color:var(--text);background:var(--panel2)}
    .primary{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border:0;font-weight:700}.danger{color:#fecdd3;border-color:#6b2737;background:#321923}
    .toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.search{flex:1;min-width:190px}
    input,textarea,select{width:100%;background:#101017;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;outline:none}
    input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:120px;line-height:1.5}
    .search input{height:44px}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:12px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 12px;border-radius:999px;font-size:13px}.chip.active{background:#33245a;border-color:#7652bc;color:#fff}
    .category-filters{display:flex;gap:8px;overflow:auto;padding:0 0 12px;margin-bottom:8px;scrollbar-width:thin}
    .category-filters .chip{font-size:12px;padding:7px 11px}
    .sectionline{display:flex;align-items:center;justify-content:space-between;margin:8px 0 13px}.sectionline strong{font-size:15px}.count{color:var(--muted);font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .card{background:linear-gradient(160deg,#1b1a24,#121219);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0;box-shadow:0 8px 20px #0003}
    .thumb{width:100%;aspect-ratio:4/5;object-fit:cover;background:#24232e;display:block}.placeholder{aspect-ratio:4/5;display:grid;place-items:center;color:#777;font-size:42px;background:linear-gradient(135deg,#252235,#111118)}
    .cardbody{padding:11px}.cardtitle{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cardmeta{font-size:11px;color:var(--muted);margin-top:7px;display:flex;justify-content:space-between;gap:6px}
    .cardcategories,.detailcategories{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.category-badge{display:inline-block;background:#2a2040;border:1px solid #514071;color:#dfd0ff;border-radius:999px;padding:3px 7px;font-size:10px;line-height:1.3}
    .fab{position:fixed;right:max(18px,calc((100vw - 900px)/2 + 18px));bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;border:0;border-radius:20px;background:linear-gradient(135deg,#a78bfa,#6d28d9);color:#fff;font-size:30px;box-shadow:0 12px 30px #0008}
    .view{display:none}.view.active{display:block}.backrow{display:flex;align-items:center;gap:10px;margin-bottom:16px}.back{background:none;border:0;color:var(--accent);font-size:15px;padding:8px 0}
    .detailhero{width:100%;max-height:420px;object-fit:contain;border-radius:16px;background:#101017;border:1px solid var(--line)}
    .zoomable{cursor:zoom-in}.detailtitle{font-size:22px;margin:15px 0 5px;overflow-wrap:anywhere}.muted{color:var(--muted);font-size:12px}
    .block{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin:14px 0}.blockhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.blockhead strong{font-size:14px}.copy{padding:7px 10px;border-radius:9px;border:1px solid #57427e;background:#281d3c;color:#e9ddff;font-size:12px}.prompttext{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:13px;color:#e4e1ec;max-height:330px;overflow:auto}
    .attachments{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.attachments img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.actions button{flex:1;min-width:90px}
    .form{display:grid;gap:14px}.field label{display:block;font-size:13px;color:#d8d4e2;margin:0 0 7px}.hint{font-size:11px;color:var(--muted);margin-top:6px}
    .category-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .category-option{display:flex!important;align-items:center;gap:8px;background:#17151f;border:1px solid var(--line);border-radius:11px;padding:10px;margin:0!important;color:var(--text)!important}
    .category-option input{width:17px;height:17px;margin:0;accent-color:#8b5cf6}
    .filebox{border:1px dashed #514766;border-radius:13px;padding:14px;background:#111018}.filebox input{padding:7px;background:transparent;border:0}
    .previewrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.preview{position:relative;width:76px;height:76px}.preview img{width:100%;height:100%;object-fit:cover;border-radius:10px}.preview button{position:absolute;right:-5px;top:-5px;border:0;border-radius:50%;background:#3b1b2a;color:white;width:23px;height:23px}
    .formbuttons{display:flex;gap:9px}.formbuttons button{flex:1}.notice{font-size:11px;color:var(--muted);line-height:1.5;margin-top:18px}
    .hidden{display:none!important}
    body.viewer-open{overflow:hidden}
    .image-viewer{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.96);display:flex;align-items:center;justify-content:center;padding:60px 12px 70px}
    .viewer-image{max-width:100%;max-height:100%;object-fit:contain;touch-action:none;user-select:none;-webkit-user-drag:none;will-change:transform}
    .viewer-close{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:44px;height:44px;border:1px solid #555;background:#20202a;color:#fff;border-radius:50%;font-size:25px;z-index:2}
    .viewer-nav{position:absolute;top:50%;transform:translateY(-50%);border:1px solid #555;background:#20202a;color:white;border-radius:50%;width:42px;height:42px;font-size:22px;z-index:2}
    .viewer-nav:disabled{opacity:.25}.viewer-prev{left:12px}.viewer-next{right:12px}
    .viewer-counter{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#ddd;font-size:13px}
    @media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.app{padding-left:24px;padding-right:24px}.category-choices{grid-template-columns:repeat(3,minmax(0,1fr))}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="logo">✦</div><div><h1>AI Prompt Vault</h1><div class="sub">YOUR CREATIVE LIBRARY</div></div></div>
    <button class="iconbtn" id="backupBtn" aria-label="バックアップ">↥</button>
  </header>

  <main id="listView" class="view active">
    <div class="toolbar">
      <div class="search"><input id="search" type="search" placeholder="タイトル・プロンプトを検索"></div>
      <button class="secondary" id="sortBtn">新しい順 ↓</button>
    </div>
    <div class="filters">
      <button class="chip active" data-filter="all">すべて</button>
      <button class="chip" data-filter="fav">♥ お気に入り</button>
    </div>
    <div class="category-filters" id="categoryFilters" aria-label="カテゴリーで絞り込み"></div>
    <div class="sectionline"><strong>マイコレクション</strong><span class="count" id="count">0件</span></div>
    <div class="grid" id="cards"></div>
    <button class="fab" id="addFab" aria-label="新規登録">＋</button>
  </main>

  <main id="detailView" class="view">
    <div class="backrow"><button class="back" id="detailBack">‹ 一覧に戻る</button><span class="muted">PROMPT DETAILS</span></div>
    <div id="detailContent"></div>
  </main>

  <main id="formView" class="view">
    <div class="backrow"><button class="back" id="formBack">‹ 戻る</button><span class="muted" id="formHeading">NEW PROMPT</span></div>
    <form class="form" id="promptForm">
      <div class="field"><label for="title">タイトル *</label><input id="title" required maxlength="120" placeholder="例：Gothic Lolita Fashion"></div>
      <div class="field"><label>カテゴリー（複数選択可）</label><div class="category-choices" id="categoryChoices"></div><div class="hint">該当するカテゴリーを複数選択できます。</div></div>
      <div class="field"><label>サムネイル画像 *</label><div class="filebox"><input id="cover" type="file" accept="image/*"><div class="hint">一覧に表示するメイン画像を1枚選択してください。</div><div class="previewrow" id="coverPreview"></div></div></div>
      <div class="field"><label for="prompt">メインプロンプト</label><textarea id="prompt" placeholder="画像生成に使用したプロンプトを入力"></textarea></div>
      <div class="field"><label for="negative">ネガティブプロンプト</label><textarea id="negative" placeholder="除外したい要素を入力"></textarea></div>

      <div class="field">
        <label for="application">生成アプリケーション</label>
        <input id="application" placeholder="例：ComfyUI、Draw Things、Midjourney">
      </div>
      <div class="field">
        <label for="model">使用モデル</label>
        <input id="model" placeholder="例：Wan2.2、FLUX、RealVisXL">
      </div>
      <div class="field">
        <label for="memo">メモ</label>
        <textarea id="memo" placeholder="設定や修正内容などを自由に記入"></textarea>
      </div>
      <div class="field"><label for="extras">追加画像（複数選択可）</label><div class="filebox"><input id="extras" type="file" accept="image/*" multiple><div class="hint">参考画像・衣装資料などを複数選択できます。追加画像の枚数は固定していません。</div><div class="previewrow" id="extraPreview"></div></div></div>
      <div class="formbuttons"><button type="button" class="secondary" id="cancelForm">キャンセル</button><button type="submit" class="primary">保存する</button></div>
    </form>
    <p class="notice">画像と文章はこのブラウザ内に保存されます。ブラウザのデータ消去や端末故障に備え、定期的にバックアップしてください。</p>
  </main>
  <p class="notice" id="storageNote">このアプリは端末内保存を使用します。クラウドには送信しません。</p>
</div>

<div id="imageViewer" class="image-viewer hidden" aria-hidden="true" role="dialog" aria-label="画像拡大表示">
  <button id="viewerClose" class="viewer-close" aria-label="閉じる">×</button>
  <button id="viewerPrev" class="viewer-nav viewer-prev" aria-label="前の画像">‹</button>
  <img id="viewerImage" class="viewer-image" alt="拡大画像">
  <button id="viewerNext" class="viewer-nav viewer-next" aria-label="次の画像">›</button>
  <div id="viewerCounter" class="viewer-counter"></div>
</div>
<input type="file" id="restoreFile" accept="application/json" class="hidden">
<script src="./app.js"></script>
</body>
</html>
